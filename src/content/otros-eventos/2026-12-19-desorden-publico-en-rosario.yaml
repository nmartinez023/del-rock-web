descripcion: |-
  DESORDEN PÚBLICO EN ROSARIO.

  Con más de 40 años de trayectoria musical, visitaran la ciudad por primera vez, para traernos sus clásicos escuchados en toda Latinoamérica y el mundo, trayendo esa vibra del caribe.

   En representación local, ROSARIO SMOWING, con más de 20 años de trayectoria a través del swing y el ska, dará su potente show y pondrá a bailar al son del sur.

  Cómo teloneros, tendremos a MAGHNA, banda de rock fusión latina integrada por músicos venezolanos y locales de Rosario, dónde van a estar estrenando sus primeros temas propios.

  ¡Una gran fiesta de Ska, Rock y Fusión Latinoamericana!

  INFO ENTRADAS:

  VIP
  Acceso al sector VIP exclusivo en la parte superior del venue, con espacio reservado y atención diferenciada para disfrutar del show con mayor comodidad.

  EXPERIENCIA DESORDEN PÚBLICO
  Una experiencia exclusiva para compartir en persona con Desorden Público antes y durante su prueba de sonido.
  Incluye:
  * Acceso exclusivo a la prueba de sonido.
  * Interpretación de canciones y momentos especiales fuera del setlist oficial.
  * Encuentro y charla con la banda.
  * Fotos y autógrafos.
  * Identificación especial de la experiencia.
  * Ingreso prioritario al venue antes de la apertura general, permitiendo acceder al sector frente al escenario antes que el público general.

  La ubicación dentro del sector estará sujeta al orden de llegada.
