descripcion: |-
  LUCA SPERANDIO EN VIVO — ROSARIO

  Una noche para encontrarnos con la música.

  Luca Sperandio presenta su universo musical en un concierto con banda en vivo, recorriendo canciones de su proyecto y compartiendo una selección de su repertorio más reciente.

  Una propuesta de folk, indie y canción de autor, con melodías íntimas, sonidos orgánicos y letras que hablan de los procesos, los vínculos, la naturaleza y el movimiento de la vida.

  Después de recorrer distintas ciudades con su música, Luca vuelve a Rosario para una fecha especial, acompañado por su banda.

  Una noche para escuchar, cantar, sentir y compartir.

  🎫 Capacidad limitada.
