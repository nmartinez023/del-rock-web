descripcion: |-
  Leandro Pagura Cuarteto

  Leandro Pagura Cuarteto es una propuesta de jazz fusión que combina composición, improvisación y una mirada contemporánea sobre el lenguaje del jazz, con influencias del funk, rock y la música latinoamericana.

  El cuarteto está integrado por Leandro Pagura (bajo), Santiago Pagura (guitarra), Matías Galasso (teclados) y Álvaro Manzanero (batería).

  Una propuesta de música instrumental, con mucha energía y libertad creativa, que recorre distintos paisajes sonoros a través de composiciones propias y una fuerte interacción entre sus integrantes.
