descripcion: |-
  Un concierto concebido para disfrutar la música en su expresión más íntima: un piano, una voz y la emoción de las grandes canciones.
  Ángela Navarro, una de las voces más destacadas surgidas de La Voz Argentina, y Martín Mazzon, pianista, productor y ganador de dos Premios Martín Fierro, presentan un espectáculo de gran sensibilidad artística, con arreglos originales que resaltan la esencia de cada interpretación.
  El repertorio recorre clásicos inolvidables de artistas como Whitney Houston, Adele, Aretha Franklin, Joss Stone, Queen y Alicia Keys, en un formato cercano donde el piano y la voz son protagonistas absolutos.
  Una propuesta elegante y profundamente emotiva que invita a redescubrir grandes canciones desde una mirada personal, con interpretaciones cargadas de matices, sutileza y emoción.
