descripcion: "NOCHE HISTÓRICA – SERÚ GIRÁN POR LEBÓN Y AZNAR David Lebón y Pedro Aznar se reúnen para revivir los clásicos de Serú Girán, la banda que definió el alma del rock argentino. En una celebración única, dos de sus creadores interpretarán en vivo canciones que marcaron generaciones y dejaron una huella imborrable en la historia de la música. No será un simple homenaje, sino el reencuentro con un repertorio que sigue latiendo con la misma intensidad que el primer día. La vigencia de Serú Girán se reafirmó en 2025 con su presentación ante 150 mil personas en el Quilmes Rock y con su paso por el Festival Cordillera de Bogotá. Ahora, en el Movistar Arena, volverán a sonar clásicos eternos como “Canción de Alicia en el país”, “Seminare”, “Esperando nacer”, “Perro Andaluz” y muchos más. Será una noche emotiva y poderosa, un encuentro entre generaciones para celebrar canciones que siguen vivas en la memoria del público. No es solo un concierto: es una cita con la historia grande del rock argentino."
