descripcion: TAN BIÓNICA VUELVE AL MOVISTAR ARENA Tan Biónica regresa al Movistar Arena para reencontrarse con su público en una noche que combinará los grandes clásicos de la banda con las canciones de El Regreso. Luego de su histórico regreso, la banda agotó entradas y convocó a más de 500.000 personas con su gira La Última Noche Mágica, incluyendo diez shows sold out en el Movistar Arena. Más recientemente, agotó tres Vélez con El Regreso Tour. Chano, Bambi, Diega y Seby vuelven a Buenos Aires para celebrar junto a varias generaciones de fans la música que marcó una época y las nuevas canciones que ya se convirtieron en parte de su historia. Una noche para cantar, emocionarse y volver a vivir la magia de Tan Biónica.
