descripcion: "LAS PASTILLAS DEL ABUELO VUELVEN AL MOVISTAR ARENA CON DOS SHOWS 360° Las Pastillas del Abuelo, una de las bandas más queridas del rock argentino, vuelven al Movistar Arena con una propuesta inédita: dos shows 360° el viernes 20 y sábado 21 de noviembre. Liderada por Juan Germán “Piti” Fernández, la banda se reencontrará con su público en un formato especialmente diseñado para disfrutar sus canciones desde todos los ángulos y convertir el estadio en un espacio de encuentro, celebración y rock. Con más de 20 años de trayectoria, grandes escenarios agotados y una conexión inquebrantable con sus seguidores, Las Pastillas del Abuelo apuestan a una experiencia diferente para cerrar el año a lo grande. Además, la banda continúa adelantando su nuevo material con “Tarot”, una canción inspirada en los Arcanos Mayores del Tarot de Marsella y dedicada por Piti Fernández a su compañera de vida. El tema abre un nuevo capítulo en el camino hacia su próximo disco, que traerá más novedades durante 2026."
