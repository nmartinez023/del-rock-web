descripcion: "PARALAMAS + NONPALIDECE: POR PRIMERA VEZ JUNTOS Dos bandas fundamentales de la música latinoamericana se encuentran por primera vez en un mismo escenario. Nonpalidece y Os Paralamas do Sucesso llegan al Movistar Arena de Buenos Aires el 23 de marzo de 2027 para protagonizar una noche histórica, donde el reggae, el rock, el ska y las raíces latinoamericanas se unen en un encuentro que atraviesa generaciones. La fecha será parte de la celebración de los 30 años de trayectoria de Nonpalidece, uno de los grandes referentes del reggae argentino y latinoamericano, que regresa al Arena después de agotar su show en abril de 2025. Por su parte, Os Paralamas do Sucesso, con más de 40 años de carrera, llega con clásicos como “Meu Erro”, “Alagados”, “Lanterna dos Afogados” y “Aonde Quer Que Eu Vá”, luego de agotar cuatro presentaciones en La Trastienda en 2026. Dos grandes historias musicales. Un mismo escenario. Una noche para celebrar canciones que atravesaron fronteras y generaciones."
