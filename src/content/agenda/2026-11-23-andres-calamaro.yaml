descripcion: ¡CALAMARO SUMA UNA ÚLTIMA FECHA EL 23 DE NOVIEMBRE EN EL MOVISTAR ARENA! Tras agotar nueve funciones en menos de un año, Andrés Calamaro anuncia su décimo y último show de 2026 en el Movistar Arena, para despedir un año histórico junto a su público. Uno de los artistas más consagrados del rock argentino regresa con “Como Cantor”, una gira que celebra el poder de la música y el encuentro con sus fans. Con un repertorio que reúne los grandes clásicos de su carrera, canciones que atraviesan generaciones y una banda de primer nivel, el Salmón promete una noche cargada de emoción, recuerdos y música en vivo. El 23 de noviembre será una nueva oportunidad para disfrutar de sus canciones y ser parte de un cierre de año inolvidable para uno de los referentes indiscutidos de la música argentina.
