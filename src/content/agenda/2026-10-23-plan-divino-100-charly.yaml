descripcion: |-
  PLAN DIVINO CELEBRA EL CUMPLEAÑOS DE CHARLY GARCÍA EN JAGUAR HAÜS

  El próximo viernes 23 de octubre, Plan Divino llega a Jaguar Haüs para presentar “100% Charly”, un espectáculo íntegramente dedicado a la obra de Charly García, en la noche de su cumpleaños.

  Con Tiago Galíndez y Mery San Dámaso al frente, el show contará con Tato Zeballos en guitarra y dirección musical, Yago Varas en bajo, Agustín Borsini en batería y Pato Massini en teclados, además de la participación de artistas invitados.

  Será una verdadera celebración colectiva para homenajear a uno de los músicos más importantes e influyentes de la historia argentina. Un recorrido emocionante por las canciones que marcaron generaciones, desde Sui Generis y Serú Girán hasta los grandes clásicos de su inolvidable carrera solista.

  Con la potencia, la emoción y el sello propio de Plan Divino, la banda prepara una noche especial para cantar, emocionarse y celebrar el cumpleaños de un artista eterno.

  PLAN DIVINO PRESENTA “100% CHARLY”

  Tiago Galíndez y Mery San Dámaso
  Tato Zeballos: guitarra y dirección musical
  Yago Varas: bajo
  Agustín Borsini: batería
  Pato Massini: teclados
  Artistas invitados

