descripcion: El show de Rata Blanca, originalmente previsto para el 2 de diciembre, ha sido reprogramado para el sábado 5 de diciembre en el Movistar Arena. La legendaria banda reafirma su lugar como una de las más influyentes del hard rock y heavy en español. Liderados por Walter Giardino, prometen una noche cargada de clásicos y potencia en vivo. Con una carrera que despegó en los ‘90 y un hito como Magos, Espadas y Rosas —que superó los 5 millones de copias vendidas—, Rata Blanca consolidó un sonido único que fusiona riffs pesados con influencias de la música clásica. Con múltiples discos de oro y platino, y una química inconfundible entre la guitarra de Giardino y la voz de Adrián Barilari, la banda sigue haciendo historia en cada escenario.
