descripcion: EL NATTY COMBO VUELVE A ROSARIO Después de mucho tiempo, El Natty Combo vuelve a Rosario para reencontrarse con el público rosarino en una noche muy especial. La banda llegará a la ciudad presentando su último disco, “Sergio Colombo canta Los Fundamentalistas”, más los clásicos de siempre de El Natty Combo. Un proyecto que nació desde la admiración, el respeto y el profundo vínculo musical que une a Sergio Colombo y El Natty Combo con la obra de Indio y Los Fundamentalistas del Aire Acondicionado. Sergio Colombo, líder, cantante y saxofonista de El Natty Combo, voz y saxo de Los Fundamentalistas del Aire Acondicionado, forma parte de una historia musical profundamente ligada a la obra de Indio y construida a lo largo de los años. En un momento particularmente emotivo, El Natty Combo vuelve a llevar este trabajo al escenario como un homenaje que celebra la obra y el legado de Indio, recorriendo sus canciones desde el universo sonoro y la identidad reggae de la banda. Rosario será parte de este encuentro con un show que recorrerá canciones que nos hicieron vibrar y que forman parte de una historia que sigue latiendo, interpretadas en las versiones de El Natty Combo, junto a los clásicos de siempre de la banda. SERGIO COLOMBO CANTA LOS FUNDAMENTALISTAS + CLÁSICOS DE SIEMPRE Una noche de música, memoria y celebración . Un homenaje hecho desde el respeto, la historia compartida y el corazón .
